<rect x="20" y="350" width="120" height="200"/><rect x="20" y="350" width="120" height="40" fill="#ddd"/><text x="28" y="366">Logo</text><text x="28" y="382">Home Threats Defs</text><rect x="30" y="400" width="100" height="40"/><text x="40" y="424">Hero image</text><rect x="30" y="448" width="100" height="26"/><rect x="30" y="480" width="100" height="26"/><text x="30" y="568">HOME (stacked)</text>
<rect x="170" y="350" width="120" height="200"/><rect x="170" y="350" width="120" height="40" fill="#ddd"/><text x="178" y="366">Logo</text><text x="178" y="382">Home Threats Defs</text><rect x="180" y="400" width="100" height="50"/><rect x="180" y="458" width="100" height="50"/><text x="180" y="568">THREATS (term above text)</text>
<rect x="320" y="350" width="120" height="200"/><rect x="320" y="350" width="120" height="40" fill="#ddd"/><text x="328" y="366">Logo</text><text x="328" y="382">Home Threats Defs</text><rect x="330" y="400" width="100" height="30"/><rect x="330" y="436" width="100" height="30"/><rect x="330" y="472" width="100" height="60" stroke-dasharray="5 3"/><text x="320" y="568">DEFENSES (tiles stack)</text>

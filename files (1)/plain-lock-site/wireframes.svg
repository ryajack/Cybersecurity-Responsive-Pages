<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial" font-size="12">
<rect width="1000" height="560" fill="#fff"/>
<text x="20" y="25" font-size="16" font-weight="bold">Plain Lock wireframes: desktop (top) and phone (bottom)</text>

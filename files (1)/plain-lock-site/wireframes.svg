<text x="364" y="92">Page title + intro</text>
<g><rect x="364" y="106" width="272" height="36"/><rect x="364" y="150" width="272" height="36"/><rect x="364" y="194" width="272" height="36"/><rect x="364" y="238" width="272" height="36"/></g>
<text x="372" y="128">Term | description (flex row)</text><text x="372" y="172">Term | description</text><text x="372" y="216">Term | description</text><text x="372" y="260">Term | description</text>
<rect x="350" y="284" width="300" height="26" fill="#ddd"/><text x="358" y="301">Footer links</text><text x="350" y="328">THREATS</text>
<!-- Defenses desktop -->
<rect x="680" y="40" width="300" height="270"/><rect x="680" y="40" width="300" height="26" fill="#ddd"/><text x="688" y="58">Logo     Home | Threats | Defenses</text>
<text x="694" y="92">Page title + intro</text>
<rect x="694" y="106" width="62" height="70"/><rect x="762" y="106" width="62" height="70"/><rect x="830" y="106" width="62" height="70"/><rect x="898" y="106" width="68" height="70"/><text x="700" y="145">Tiles (flex wrap)</text>
<rect x="694" y="196" width="272" height="80" stroke-dasharray="5 3"/><text x="704" y="216">Tag: If something goes wrong</text><text x="704" y="238">1. 2. 3. 4. checklist</text>
<rect x="680" y="284" width="300" height="26" fill="#ddd"/><text x="688" y="301">Footer links</text><text x="680" y="328">DEFENSES</text>
